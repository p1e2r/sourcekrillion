# Copy .env.example to .env and fill it in. .env is git-ignored: your keys and DEEP_WORD stay on the server.
services:
  sourcekrillion:
    image: ghcr.io/p1e2r/sourcekrillion:latest
    container_name: sourcekrillion
    restart: unless-stopped
    ports:
      - "3051:3051"
    env_file: .env
    volumes:
      - ./data:/data
