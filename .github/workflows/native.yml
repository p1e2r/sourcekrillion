name: Native app
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macos-universal
          - os: windows-latest
            name: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S native -B native/build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build native/build --config Release --parallel
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent native/build/SourceKrillion.app SourceKrillion-${{ matrix.name }}.zip
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force SourceKrillion | Out-Null
          Copy-Item native/build/Release/SourceKrillion.exe SourceKrillion/
          Copy-Item -Recurse native/build/Release/assets SourceKrillion/
          Compress-Archive -Path SourceKrillion -DestinationPath SourceKrillion-${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v4
        with: { name: 'SourceKrillion-${{ matrix.name }}', path: 'SourceKrillion-${{ matrix.name }}.zip' }
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with: { files: 'SourceKrillion-${{ matrix.name }}.zip' }
